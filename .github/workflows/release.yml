name: Release to Maven Central

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (bundle only, no upload)"
        required: false
        default: true
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure server credentials
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>\${env.CENTRAL_TOKEN_USERNAME}</username>
                <password>\${env.CENTRAL_TOKEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build, sign, and (dry-run) publish
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            mvn -B -Pci-release clean verify
            echo "::notice::Dry-run complete. Bundle at target/central-publishing/central-bundle.zip"
          else
            mvn -B -Pci-release clean deploy
          fi
